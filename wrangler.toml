name = "ltc-care-team"
# Lives at the repository root so Cloudflare Workers Builds' default `npx wrangler deploy` finds it.
main = "apps/gateway/src/index.ts"
compatibility_date = "2026-10-01"
# Serve on <name>.<account>.workers.dev, but do not publish a public preview URL per version:
# those keep old code (including fixed bugs) reachable.
workers_dev = true
preview_urls = false

# Keep Worker logs (console output, errors) in the dashboard: Workers → ltc-care-team → Logs.
[observability]
enabled = true

# The Worker serves the built web app and the API from one origin (the session cookie is
# __Host- and SameSite=Strict). Only /api/* runs the Worker; everything else is a static asset,
# with unknown paths falling back to index.html for client-side routes. Build apps/web first.
[assets]
directory = "apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_MODE = "DEMO"
GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbyy88DJ-eKDt9mYt2R5Y4y57TC-q73k81tYlFQ23SfWtkz8EyRkozC0ap-2xAEAk4d_/exec"

[[d1_databases]]
binding = "SECURITY_DB"
database_name = "smart-ltc-security-demo"
database_id = "c347c344-935c-41e4-91bd-2beb02b38553"

[[kv_namespaces]]
binding = "SECURITY_KV"
id = "9726fb0de3fe4b1887d102ad8e7a01ba"

